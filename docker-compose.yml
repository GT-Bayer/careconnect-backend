version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: careconnect-mysql
    restart: always
    environment:
      MYSQL_DATABASE: careconnect_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: